name: SSAO software rendering check
on:
  workflow_run:
    workflows: [SSAO build and validation]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ssao-linux-x86_64
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Install software Vulkan and display
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools xvfb libxrandr2 libxinerama1 libxcursor1 libxi6 libx11-6 zlib1g curl
      - name: Extract and fetch demo scene
        run: |
          mkdir project
          tar -xzf artifact/dist/ssao-linux-x86_64.tar.gz -C project
          cd project
          bash tools/fetch_demo_map.sh
      - name: Render two real frames with SSAO off and on
        working-directory: project
        env:
          ERUPTION_TEST_SCREENSHOT_FRAME: '3'
          ERUPTION_TEST_GRAPHICS_PRESET: low
          ERUPTION_TEST_NO_EFFECTS: '1'
          ERUPTION_TEST_NO_SHADOWS: '1'
          ERUPTION_RENDER_SCALE: '0.5'
        run: |
          xvfb-run -a vulkaninfo --summary > vulkan-runtime.txt 2>&1
          timeout 600 xvfb-run -a bash tools/ssao_demo.sh capture
      - name: Upload runtime evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssao-runtime-evidence
          path: |
            project/evidencias/
            project/vulkan-runtime.txt
          if-no-files-found: warn
