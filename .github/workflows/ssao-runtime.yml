name: SSAO software rendering check
on:
  workflow_run:
    workflows: [SSAO build and validation]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  render:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ssao-linux-x86_64
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Install software Vulkan and display
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y gdb vulkan-validationlayers mesa-vulkan-drivers libvulkan1 vulkan-tools xvfb libxrandr2 libxinerama1 libxcursor1 libxi6 libx11-6 zlib1g curl
      - name: Extract and fetch demo scene
        run: |
          mkdir project
          tar -xzf artifact/dist/ssao-linux-x86_64.tar.gz -C project
          cd project
          bash tools/fetch_demo_map.sh
      - name: Render two real frames with SSAO off and on
        working-directory: project
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          ERUPTION_TEST_SCREENSHOT_FRAME: '3'
          ERUPTION_TEST_GRAPHICS_PRESET: low
          ERUPTION_TEST_NO_EFFECTS: '1'
          ERUPTION_TEST_NO_SHADOWS: '1'
          ERUPTION_RENDER_SCALE: '0.5'
        run: |
          xvfb-run -a vulkaninfo --summary > vulkan-runtime.txt 2>&1
          if ! timeout 600 xvfb-run -a bash tools/ssao_demo.sh capture; then
            timeout 120 xvfb-run -a gdb -batch -ex run -ex 'bt 20' --args ./eruption-engine --map parana_field --screenshot debug.png > debug-backtrace.txt 2>&1 || true
            cat debug-backtrace.txt
            exit 1
          fi
          if grep -REn 'Validation Error|VUID-' evidencias/ --include='*.log'; then
            echo 'Vulkan validation errors found in captured execution.' >&2
            exit 1
          fi
      - name: Upload runtime evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssao-runtime-evidence
          path: |
            project/evidencias/
            project/vulkan-runtime.txt
            project/debug-backtrace.txt
          if-no-files-found: warn
