name: SSAO build and validation
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache cmake ninja-build g++ libvulkan-dev glslc glslang-tools spirv-tools libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libx11-dev zlib1g-dev vulkan-tools mesa-vulkan-drivers vulkan-validationlayers xvfb
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ssao-ubuntu24-gcc13-${{ github.sha }}
          restore-keys: ssao-ubuntu24-gcc13-
      - name: Configure
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=RelWithDebInfo -DERUPTION_FETCH_DEMO_MAP=OFF -DERUPTION_BUILD_TESTS=ON
      - name: Build engine and tests
        run: cmake --build build-ci --parallel 2 -- -k 0
      - name: Run CPU tests
        run: ctest --test-dir build-ci --output-on-failure
      - name: Validate SSAO SPIR-V
        run: |
          spirv-val --target-env vulkan1.3 shaders/lighting/ssao.frag.spv
          spirv-val --target-env vulkan1.3 shaders/lighting/ssao_blur.frag.spv
          spirv-val --target-env vulkan1.3 shaders/lighting/ambient.frag.spv
      - name: Report available Vulkan device
        run: xvfb-run -a vulkaninfo --summary > vulkan-device.txt 2>&1
      - name: Package Linux build
        run: |
          mkdir -p dist
          tar -czf dist/ssao-linux-x86_64.tar.gz eruption-engine shaders data assets tools/fetch_demo_map.sh tools/ssao_demo.sh docs/ENTREGA_SSAO.md LICENSE NOTICE
      - uses: actions/upload-artifact@v4
        with:
          name: ssao-linux-x86_64
          path: |
            dist/ssao-linux-x86_64.tar.gz
            vulkan-device.txt
          if-no-files-found: error
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/ccache
          key: ssao-ubuntu24-gcc13-${{ github.sha }}
